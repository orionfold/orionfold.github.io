name: Deploy to GitHub Pages

on:
  # The flip (S12): Pages source is now GitHub Actions, so every push to main
  # rebuilds and deploys the Astro site in dist/. workflow_dispatch stays for
  # manual re-runs.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung build must not hold the deploy lane for the default six hours.
    timeout-minutes: 30
    env:
      # G-036: production Stripe, Supabase, Resend and private media are active
      # and passed the no-charge release rehearsal. Keep the public build's
      # commercial state explicit at the deployment boundary.
      PUBLIC_RELAY_OPERATOR_WORKSHOP_CHECKOUT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      # Astro keeps its optimized-image cache under node_modules/.astro, which
      # `npm ci` has just emptied. Restoring the newest cache turns the ~6 min
      # image-heavy build into a mostly incremental one; a miss costs nothing.
      - name: Restore the Astro image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-image-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-image-cache-${{ runner.os }}-

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium

      # Every step below is one entry of scripts/preflight.mjs, in preflight
      # order. `npm run preflight` runs the identical chain locally and the
      # pre-push hook refuses a push to main without proof that it passed on the
      # pushed tree. scripts/test/preflight.test.mjs fails the moment this list
      # and the script disagree, so the chain cannot drift apart again.
      - name: Sweep the tree for local-only paths, key material, and mailboxes
        run: node scripts/preflight.mjs sweep

      # Flow is rehearsed locally in its launched state before the product lane
      # declares release. A push must not turn that rehearsal into a public
      # placeholder download. The repository variable is an operator-owned
      # declaration; the script independently requires a real DMG and a signed,
      # non-empty appcast that names the same package.
      - name: Verify Flow release boundary
        env:
          FLOW_RELEASE_DECLARED: ${{ vars.FLOW_RELEASE_DECLARED }}
        run: node scripts/preflight.mjs boundary

      - name: Test server and commerce contracts
        run: node scripts/preflight.mjs deno

      - name: Build site
        run: node scripts/preflight.mjs build

      - name: Test source and rendered-output contracts
        run: node scripts/preflight.mjs node

      - name: Test critical browser journeys
        run: node scripts/preflight.mjs e2e

      # Failed browser journeys leave traces and screenshots; ship them with the
      # run so a red deploy can be read without a rerun.
      - name: Upload browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # D2: purge the Cloudflare edge cache so a fresh deploy is never served
      # stale. HTML is already DYNAMIC (uncached) and /_astro/* is fingerprinted,
      # so this mainly refreshes the stable-URL assets (OG images, sitemap,
      # robots.txt, llms.txt, favicon). Uses a purge-ONLY scoped token. Fail-safe:
      # if the secret is not set (e.g. on a fork), the step skips cleanly instead
      # of failing the deploy.
      - name: Purge Cloudflare cache
        env:
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_PURGE_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare purge secrets not set — skipping cache purge."
            exit 0
          fi
          echo "Purging Cloudflare cache for zone $CF_ZONE_ID"
          resp=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || {
            echo "::warning::Cloudflare purge did not report success (deploy still succeeded)."
            exit 0
          }
          echo "Cloudflare cache purged."
