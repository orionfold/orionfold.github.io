name: Recover migration presentation

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful migration main deploy run ID
        required: true
        type: string
      artifact_id:
        description: Compatible recovery artifact ID from that run
        required: true
        type: string
      manifest_sha256:
        description: Reviewed manifest SHA-256 from the source build summary
        required: true
        type: string
      expected_deployment_id:
        description: Exact currently successful github-pages deployment ID
        required: true
        type: string
      expected_sha:
        description: Exact currently deployed migration candidate commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

# Shared with normal deploy. Never cancel a deployment already holding the lock.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_SOURCE_RUN: ${{ inputs.source_run }}
      RECOVERY_ARTIFACT_ID: ${{ inputs.artifact_id }}
      RECOVERY_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      RECOVERY_EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment_id }}
      RECOVERY_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout reviewed recovery tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Only authenticated successful main-run artifacts are accepted. The
      # extractor rejects paths, links, duplicate members and oversized input.
      - name: Fetch and verify exact migration recovery artifact
        run: node scripts/migration-recovery.mjs verify --bundle "${{ runner.temp }}/migration-recovery"

      - name: Upload verified recovered Pages bytes
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/migration-recovery/site/
          retention-days: 35
          include-hidden-files: true

      # Re-query after upload and immediately before promotion, while holding
      # the same lock and approved environment as the normal main deployment.
      - name: Recheck exact current deployment and retained evidence
        run: node scripts/migration-recovery.mjs recheck --bundle "${{ runner.temp }}/migration-recovery"

      - name: Deploy verified recovery to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_SOURCE_RUN: ${{ inputs.source_run }}
      RECOVERY_ARTIFACT_ID: ${{ inputs.artifact_id }}
      RECOVERY_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - name: Checkout reviewed verification tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch verified reference bytes for HTTP smoke
        run: node scripts/migration-recovery.mjs inspect --bundle "${{ runner.temp }}/migration-recovery"

      - name: Purge Cloudflare cache
        env:
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_PURGE_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare purge secrets not set — skipping cache purge."
            exit 0
          fi
          echo "Purging Cloudflare cache for zone $CF_ZONE_ID"
          resp=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || {
            echo "::warning::Cloudflare purge did not report success (deploy still succeeded)."
            exit 0
          }
          echo "Cloudflare cache purged."

      - name: Verify recovered routes, social assets and discovery
        run: node scripts/migration-recovery.mjs smoke --bundle "${{ runner.temp }}/migration-recovery"
